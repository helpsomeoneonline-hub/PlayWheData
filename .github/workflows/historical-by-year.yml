name: Resumable Historical Backfill

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/backfill_year.py"
      - "scripts/aggregate_years.py"
      - ".github/workflows/historical-by-year.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  year:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [1994,1995,1996,1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      YEAR: ${{ matrix.year }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch one year
        run: python -u scripts/backfill_year.py
      - name: Upload year
        uses: actions/upload-artifact@v4
        with:
          name: playwhe-year-${{ matrix.year }}
          path: year-output/year-${{ matrix.year }}.json
          retention-days: 7

  aggregate:
    needs: year
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download all years
        uses: actions/download-artifact@v4
        with:
          pattern: playwhe-year-*
          path: year-data
          merge-multiple: true
      - name: Aggregate and validate
        run: python -u scripts/aggregate_years.py
      - name: Commit historical source files
        run: |
          git config user.name "playwhe-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/historical_history.json data/historical_manifest.json data/historical_conflicts.json
          if git diff --cached --quiet; then
            echo "Historical source files already current."
            exit 0
          fi
          git commit -m "Publish resumable historical Play Whe archive"
          git pull --rebase origin main
          git push
