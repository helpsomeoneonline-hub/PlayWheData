name: Inspect NLCB Play Whe REST Record

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/inspect-rest-record.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Inspect oldest and newest structured records
        run: |
          python - <<'PY'
          import json, requests
          H={"User-Agent":"Mozilla/5.0 PlayWheData/1.0","Accept":"application/json"}
          base="https://www.nlcbgames.com/wp-json/wp/v2/play-whe-result"
          for order in ["asc","desc"]:
              url=base+"?per_page=8&orderby=id&order="+order+"&_fields=id,slug,date,acf"
              print("\n===",order,url,"===")
              r=requests.get(url,headers=H,timeout=60)
              print("STATUS",r.status_code,"TOTAL",r.headers.get("X-WP-Total"),"PAGES",r.headers.get("X-WP-TotalPages"),"BYTES",len(r.content))
              r.raise_for_status()
              for row in r.json():
                  acf=row.get("acf") or {}
                  print(json.dumps({
                      "id":row.get("id"),
                      "slug":row.get("slug"),
                      "date":row.get("date"),
                      "draw_date":acf.get("draw_date"),
                      "draw_time":acf.get("draw_time"),
                      "winning_number":((acf.get("play_whe_winning_numbers") or {}).get("winning_number"))
                  },separators=(",",":")))
          PY
