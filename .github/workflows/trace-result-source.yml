name: Trace NLCB Result Data Source

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/trace-result-source.yml"

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Trace dynamic result data
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup

          url="https://www.nlcbgames.com/play-whe-result/000027391/"
          H={"User-Agent":"Mozilla/5.0 PlayWheData/1.0"}
          r=requests.get(url,headers=H,timeout=40)
          r.raise_for_status()
          html=r.text
          soup=BeautifulSoup(html,"html.parser")

          print("BYTES",len(html))
          print("BODY_TEXT",re.sub(r"\s+"," ",soup.body.get_text(" ",strip=True))[:12000])

          for needle in ["27391","027391"]:
              print("\n=== ALL CONTEXTS",needle,"===")
              starts=[m.start() for m in re.finditer(needle,html,re.I)]
              print("COUNT",len(starts))
              for n,pos in enumerate(starts[:30]):
                  a=max(0,pos-700); b=min(len(html),pos+1400)
                  print("CTX",n,re.sub(r"\s+"," ",html[a:b]))

          print("\n=== SCRIPT SRCS ===")
          for s in soup.find_all("script",src=True):
              print(s.get("src"))

          print("\n=== NETWORK/API-LIKE TOKENS ===")
          patterns=[
              r'https?://[^"\'\s<>]+',
              r'[^"\'\s<>]*(?:ajax|api|result|draw|lottery)[^"\'\s<>]*'
          ]
          tokens=set()
          for pat in patterns:
              for m in re.finditer(pat,html,re.I):
                  token=m.group(0)
                  if len(token)<500:
                      tokens.add(token)
          for token in sorted(tokens):
              if any(k in token.lower() for k in ["ajax","api","result","draw","lottery","wp-json"]):
                  print("TOKEN",token[:500])

          print("\n=== INPUTS/DATA ATTRS ===")
          for tag in soup.find_all(True):
              attrs={k:v for k,v in tag.attrs.items() if k.startswith("data-") or k in ["value","name","id","class"]}
              joined=str(attrs)
              if any(k in joined.lower() for k in ["27391","result","draw","play-whe","number"]):
                  print(tag.name,joined[:2000])
          PY
