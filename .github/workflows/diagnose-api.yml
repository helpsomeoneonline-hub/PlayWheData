name: Diagnose NLCB JSON API

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/diagnose-api.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect WordPress API
        run: |
          python - <<'PY'
          import requests, json
          headers={"User-Agent":"PlayWheData-Diagnostic/1.0"}
          urls=[
            "https://www.nlcbgames.com/wp-json/wp/v2/types",
            "https://www.nlcbgames.com/wp-json/wp/v2/play-whe-result?per_page=3",
            "https://www.nlcbgames.com/wp-json/wp/v2/play-whe-results?per_page=3",
            "https://www.nlcbgames.com/wp-json/wp/v2/search?search=27469&per_page=10",
          ]
          for url in urls:
            print("\n===",url,"===")
            try:
              r=requests.get(url,headers=headers,timeout=20)
              print("status",r.status_code,"type",r.headers.get("content-type"),"bytes",len(r.content))
              print(r.text[:5000])
            except Exception as e:
              print("ERROR",repr(e))
          PY
