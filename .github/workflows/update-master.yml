name: Update Play Whe Master Data

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/update_master.py"
      - ".github/workflows/update-master.yml"
  schedule:
    # Trinidad & Tobago = UTC-4 year-round.
    # 10:30 AM draw: check 10:35-11:30 local.
    - cron: '35-55/5 14 * * *'
    - cron: '0-30/5 15 * * *'
    # 1:00 PM draw: check 1:05-2:00 local.
    - cron: '5-55/5 17 * * *'
    - cron: '0 18 * * *'
    # 4:00 PM draw: check 4:05-5:00 local.
    - cron: '5-55/5 20 * * *'
    - cron: '0 21 * * *'
    # 7:00 PM draw: check 7:05-8:00 local.
    - cron: '5-55/5 23 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playwhe-master-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Scrape and validate master history
        run: python scripts/update_master.py

      - name: Commit verified data if changed
        run: |
          if git diff --quiet -- data/history.json data/latest.json data/manifest.json; then
            echo "Master data already up to date."
            exit 0
          fi
          git config user.name "playwhe-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json data/latest.json data/manifest.json
          git commit -m "Update verified Play Whe master data"
          git push
