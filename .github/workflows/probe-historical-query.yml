name: Probe Historical Play Whe Queries

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/probe-historical-query.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe month and draw searches
        run: |
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup

          URL="https://www.nlcbplaywhelotto.com/nlcb-play-whe-results/"
          H={"User-Agent":"Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Safari/537.36"}

          s=requests.Session()
          r=s.get(URL,headers=H,timeout=45)
          r.raise_for_status()
          soup=BeautifulSoup(r.text,"html.parser")
          sid=(soup.find("input",{"name":"sid"}) or {}).get("value")
          print("SID_FOUND",bool(sid))

          def inspect(label, data):
              rr=s.post(URL,headers=H,data=data,timeout=45)
              print("\n===",label,"STATUS",rr.status_code,"BYTES",len(rr.content),"===")
              rr.raise_for_status()
              ss=BeautifulSoup(rr.text,"html.parser")
              title=ss.find("strong")
              print("FIRST_STRONG",title.get_text(" ",strip=True) if title else None)
              draws=[]
              for dd in ss.select(".drawDetails"):
                  txt=" | ".join(dd.stripped_strings)
                  draws.append(txt)
              print("DRAWDETAIL_COUNT",len(draws))
              for x in draws[:12]:
                  print("DRAW",x[:800])
              body=" ".join(ss.stripped_strings)
              draw_text_hits=re.findall(r"Draw #\\s*\\d+", body, re.I)
              print("DRAW_TEXT_HIT_COUNT",len(draw_text_hits),"SAMPLE",draw_text_hits[:20])
              html=rr.text
              for needle in ["04-Jul-94","Draw #1","05-Jul-94","Midday"]:
                  pos=html.find(needle)
                  if pos>=0:
                      print("HTML_AROUND",needle,html[max(0,pos-1800):pos+4500].replace("\\n"," ")[:6300])
              for pat in [r"Results for[^|]{0,80}",r"Draw #\s*1\b",r"04-Jul-94"]:
                  m=re.search(pat,body,re.I)
                  print("PATTERN",pat,"FOUND",m.group(0)[:300] if m else None)
              return rr

          inspect("MONTH_JUL_1994",{
              "playwhe_month":"Jul",
              "playwhe_year":"1994",
              "dateBtn":"SEARCH",
              "sid":sid or "",
          })

          inspect("DRAW_1",{
              "drawnumber":"1",
              "drawnumBtn":"SEARCH",
              "sid":sid or "",
          })
          PY
